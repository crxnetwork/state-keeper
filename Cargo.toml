# state-keeper workspace. `crates/vendor/im-*` is the vendored guest engine — the SAME
# pure functions the proven ELF runs; never edited here.
[workspace]
members = [
    "crates/crx-tree",
    "crates/state-keeper",
    "crates/prove-exec",
    "crates/vendor/im-calibration",
    "crates/vendor/im-math",
    "crates/vendor/im-types",
    "crates/vendor/im-crypto",
    "crates/vendor/im-state",
    "crates/vendor/im-recompute",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy = { version = "1", features = ["full", "json-rpc"] }
hex = "0.4"
tiny-keccak = { version = "2", features = ["keccak"] }
anyhow = "1"
bincode = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
